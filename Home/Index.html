<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ</title>
    <link rel="stylesheet" href="../main/style.css">
    <link rel="shortcut icon" href="../assets/logo-icon.svg"> 
</head>
<body>
    <header>
        <a href="Index.html" class="logo">
            <img src="../assets/logo.svg" alt="" id="logo">
        </a>

        <ul class="navigation">
            <li class="list active">
                <a href="../Home/index.html">
                    <img src="../assets/home.svg" alt="" id="home">
                    <span>Trang chủ</span>
                </a>
            </li>
            <li class="list">
                <a href="../staff/index.html">
                    <img src="../assets/people.svg" alt="" id="staff">
                    <span>Nhân viên</span>
                </a>
            </li>
            <li class="list">
                <a href="../ProductManagement/index.html">
                    <img src="../assets/bag-handle.svg" alt="" id="product">
                    <span>Sản phẩm</span>
                </a>
            </li>
            <li class="list">
                <a href="../TransactionManagement/index.html">
                    <img src="../assets/cart.svg" alt="" id="transaction">
                    <span>Giao dịch</span>
                </a>
            </li>
            <li class="list">
                <a href="../CustomerManagement/index.html">
                    <img src="../assets/chatbubbles.svg" alt="" id="client">
                    <span>Khách hàng</span>
                </a>
            </li>
            <li class="list">
                <a href="../ReportsandStatistics/ReportsandStatistics.html">
                    <img src="../assets/cellular.svg" alt="" id="report">
                    <span>Báo cáo</span>
                </a>
            </li>
            <div class="indicator"></div>
        </ul>

        <div class="menu">
            <a href="#" id="guide" class="guide"><img src="../assets/compass.svg" alt=""></a>
            <div class="user_frame">
                <img id="user" class="user" src="../avatar/admin.png" alt="">
            </div>
            <div id="menu-icon"><img src="../assets/menu.svg" alt=""></div>
        </div>

        <div id="user_modal" class="user_modal">
            <div class="user_modal_content">
                <div id="basic_info" class="basic_info">
                    <div class="contain1">
                        <img src="../avatar/admin.png" alt="" id="avatar">
                        <div class="contain2">
                            <p id="name" class="name">Dong Duy</p>
                            <p id="role" class="role">Quản trị viên</p>
                        </div>
                    </div>
                </div>
                <div id="profile" class="profile user_menu" href="PersonalInformation/PersonalInformation.html">
                    <img src="../assets/person-circle-outline.svg" alt="">
                    <span>Xem hồ sơ</span>
                </div>
                <div id="account" class="account user_menu">
                    <img src="../assets/at-outline.svg" alt="">
                    <span>Quản lý tài khoản</span>
                </div>
                <div id="setting" class="setting user_menu">
                    <img src="../assets/settings-outline.svg" alt="">
                    <span>Cài đặt</span>
                </div>
                <div id="help" class="help user_menu">
                    <img src="../assets/help-circle-outline.svg" alt="">
                    <span>Trợ giúp và hỗ trợ</span>
                </div>
                <div id="themes" class="themes user_menu">
                    <img src="../assets/moon-outline.svg" alt="">
                    <span>Giao diện</span>
                </div>
                <div id="logout" class="logout">
                    <img src="../assets/log-out-outline.svg" alt="">
                    <span>Đăng xuất</span>
                </div>
            </div>
        </div>
    </header>

    <main id="main_content">
        <div class="home_page_container1">
            <div class="home_page_container2">
                <div class="welcome_title">
                    <p>Xin chào!</p>
                </div>
                <div class="welcome_role">
                    <p>Bạn đang đăng nhập web FourDu store</p> 
                </div>
                <div class="welcome_motivated_quotes">
                    <p>Đầy nhiệt huyết và sẵn sàng? Bắt đầu thôi!</p>
                </div>
            </div>

            <div class="welcome_avatar">
                <img src="../assets/welcome.png" alt="">
            </div>
        </div>
    </main>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" class="indexScript"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" class="indexScript"></script>
    <script src="Script.js" type="module" class="indexScript"></script>
    <!-- <script src="AJAX.js"></script> -->

</html>
